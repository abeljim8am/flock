[package]
name = "flock-selector"
version = "0.1.0"
authors = ["Abel Jimenez <abel.jimenez@8am.com>"]
edition.workspace = true
description = "Frecency-ranked project launcher for Zellij (zellij-sessionizer replacement)"
license.workspace = true

[dependencies]
zellij-tile = { path = "../../zellij-tile" }
# The remote-agent install scripts live here so the plugin and the `flock`
# binary generate byte-identical text (see src/remote_bootstrap.rs). Also
# parses the generated layout doc with the real server-side parser in tests,
# so KDL drift fails in `cargo test` rather than at runtime.
zellij-utils = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.1.8"
